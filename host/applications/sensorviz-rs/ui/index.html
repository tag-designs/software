<!doctype html>
<!--
  sensorViz: the window of the Rust sensorViz (../app), drawn from its
  engine's view state (../core). The plot is uPlot over the engine's M4
  envelopes (plot.js). Opened as a file in a browser it runs against
  mock-engine.js on the fixture data that ../tools/export_mock_data.py writes
  into mock/; see ../README.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag View</title>
  <link rel="stylesheet" href="../../../ui-kit/kit.css">
  <link rel="stylesheet" href="uPlot.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="kit-window">
    <div class="kit-titlebar">
      <div class="kit-traffic"><span></span><span></span><span></span></div>
      <span class="kit-title">sensorViz</span>
    </div>
    <div class="kit-content">
      <div id="menubar"></div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-plot" aria-selected="true">Plot</button>
        <button type="button" role="tab" id="tab-info" aria-selected="false">File Info</button>
      </div>
      <div class="pages">
        <section id="page-plot" class="page kit-panel">
          <div class="plot-row">
            <div id="plot"></div>
            <aside id="compass" class="svz-compass" hidden></aside>
          </div>
          <div id="empty" class="svz-empty">File &gt; Load... opens a tag log (.db3).</div>
        </section>
        <section id="page-info" class="page kit-panel" hidden><pre id="info" class="kit-selectable"></pre></section>
      </div>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script src="../../../ui-kit/preact-htm.js"></script>
  <script src="../../../ui-kit/kit.js"></script>
  <script src="../../../ui-kit/kit-components.js"></script>
  <script src="../../../ui-kit/heading-dial.js"></script>
  <script src="uPlot.iife.min.js"></script>
  <script src="jspdf.umd.min.js"></script>
  <script src="plot.js"></script>
  <script src="app.js"></script>
</body>
</html>
