# The Tauri shell: runs the engine, forwards the page's commands and queries
# to it, and emits its events to the page. All behaviour is in ../core.
[package]
name = "tagprogram"
version = "0.1.0"
edition = "2024"
description = "Tag Programmer: program and test a batch of tags through a USB base"
publish = false

[dependencies]
tagprogram-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
log = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

# Every item is documented, private ones included (AGENTS.md,
# "Checking documentation coverage"); keep it that way.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
