[package]
name = "tagcalibrate-core"
version = "1.0.0"
edition = "2024"
description = "Tag Calibrator engine: no UI toolkit (port of qtcalibrate's MainWindow logic)"
publish = false

[dependencies]
tagcore = { path = "../../../libraries/tagcore-rs" }
calibsession = { path = "../../../libraries/calibsession-rs" }
serde = "1"
serde_json = "1"
log = "0.4"

# Every item is documented, private ones included (AGENTS.md,
# "Checking documentation coverage"); keep it that way.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
