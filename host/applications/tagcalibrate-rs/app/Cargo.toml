# The Tauri shell: runs the engine, forwards the page's commands and queries
# to it, and emits its events to the page. All behaviour is in ../core.
[package]
name = "tagcalibrate"
version = "1.0.0"
edition = "2024"
description = "Tag Calibrator: calibrate a tag's magnetometer and accelerometer and check its compass"
publish = false

[dependencies]
tagcalibrate-core = { path = "../core" }
tagapp-shell = { path = "../../../libraries/tagapp-shell-rs" }
# generate_context! expands here and names tauri.
tauri = { version = "2", features = [] }
# Registered by tagapp-shell; named here so the build script can resolve the
# plugins' permissions (cargo passes them only to direct dependents).
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
log = "0.4"

[build-dependencies]
tagapp-shell-build = { path = "../../../libraries/tagapp-shell-build-rs" }

# Every item is documented, private ones included (AGENTS.md,
# "Checking documentation coverage"); keep it that way.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
