# The Tauri shell: runs the engine, forwards the page's commands and queries
# to it, and emits its events to the page. All behaviour is in ../core.
[package]
name = "tagcalibrate"
version = "1.0.0"
edition = "2024"
description = "Tag Calibrator: calibrate a tag's magnetometer and accelerometer and check its compass"
publish = false

[dependencies]
tagcalibrate-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
log = "0.4"

# Already in the graph through Tauri; named here to opt out of App Nap.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSProcessInfo", "NSString"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

# Every item is documented, private ones included (AGENTS.md,
# "Checking documentation coverage"); keep it that way.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
