<!doctype html>
<!--
  Tag Monitor's window. A generic renderer of the engine's view state
  (design/ui-engine-contract.md); every rule lives in the engine. Opened as a
  file in a browser it runs against mock-engine.js; see app.js for the
  preview query parameters.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag Monitor</title>
  <link rel="stylesheet" href="../../../ui-kit/kit.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="kit-window">
    <div class="kit-titlebar">
      <div class="kit-traffic"><span></span><span></span><span></span></div>
      <span class="kit-title">Tag Monitor</span>
    </div>
    <div class="kit-content">
      <div id="menubar"></div>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-page="tag" title="Tag identity and log counts. Right-click for tag commands.">Tag</button>
        <button type="button" role="tab" data-page="config" title="The configuration to start the tag with">Configuration</button>
        <button type="button" role="tab" data-page="log" title="Messages from Tag Monitor and the tag">Error Log</button>
      </div>

      <div id="strip" class="strip">
        <span id="link" class="link" title="Whether Tag Monitor is attached to a tag"></span>
        <span class="caption" title="Attached tag type and board UUID">Type</span><span id="s-type" class="value w-type kit-selectable"></span>
        <span class="caption" title="Tag state">State</span><span id="s-state" class="value w-state kit-selectable"></span>
        <span class="caption" title="Tag clock minus this computer's clock, in seconds">Clock</span><span id="s-clock" class="value w-clock kit-selectable" title="Tag clock minus this computer's clock, in seconds"></span>
        <span class="caption" title="Tag supply voltage">Voltage</span><span id="s-voltage" class="value w-voltage kit-selectable" title="Tag supply voltage"></span>
        <span class="caption" title="Self-test result the tag reports">Self-test</span><span id="s-test" class="value w-test kit-selectable" title="Self-test result the tag reports"></span>
        <span class="kit-spacer"></span>
        <label class="approved" title="Tick when you have reviewed the configuration. Start warns if it is not ticked; any change to the configuration clears it.">
          <input id="approved" type="checkbox"> Approved
        </label>
        <button id="b-start" class="kit-button small" type="button">Start</button>
        <button id="b-stop" class="kit-button small" type="button">Stop</button>
      </div>

      <div class="pages">
        <section id="page-tag" class="page">
          <div class="tag-groups">
            <div id="tag-info" class="kit-group info">
              <div class="kit-group-title" title="Information collected from attached tag">Tag Information</div>
              <div class="kit-panel">
                <div class="kit-form info-form">
                  <span class="kit-form-label">Tag Type</span><span id="i-tagType" class="field kit-selectable" title="Type of attached tag"></span>
                  <span class="kit-form-label">Board Name</span><span id="i-board" class="field kit-selectable"></span>
                  <span class="kit-form-label">Firmware</span><span id="i-firmware" class="field kit-selectable" title="Description from Tag: Generally the tag type"></span>
                  <span class="kit-form-label">Flash Size</span><span id="i-flash" class="field kit-selectable" title="Size of tag processor memory"></span>
                  <span class="kit-form-label">Ext. Flash Size</span><span id="i-flashExt" class="field kit-selectable" title="Size of tag processor memory"></span>
                  <span class="kit-form-label">UUID</span><span id="i-uuid" class="field kit-selectable" title="A unique code embedded in hardware that can be used to identify individual tags."></span>
                  <span class="kit-form-label">Git Repo</span><span id="i-gitUrl" class="field kit-selectable" title="The location of the the tag software repository"></span>
                  <span class="kit-form-label">Source Path</span><span id="i-sourcePath" class="field kit-selectable"></span>
                  <span class="kit-form-label">Git Hash</span><span id="i-gitHash" class="field kit-selectable" title="A code that can be used to identify the version of firmware currently running on the tag. Corresponds to the first seven characters of the Git commit hash."></span>
                  <span class="kit-form-label">Build Date</span><span id="i-buildDate" class="field kit-selectable" title="Tag firmware build date and time"></span>
                </div>
              </div>
            </div>
            <div id="tag-data" class="kit-group data">
              <div class="kit-group-title">Data</div>
              <div class="kit-panel">
                <div class="kit-group">
                  <div class="kit-group-title">Logs</div>
                  <div class="kit-panel count" title="Number of log entries (long words)">
                    Count<span id="c-internal" class="field kit-selectable" title="Number of entries in tag data log"></span>
                  </div>
                </div>
                <div id="external" class="kit-group">
                  <div class="kit-group-title">External Data</div>
                  <div class="kit-panel count" title="Number of valid pages">
                    Count<span id="c-external" class="field kit-selectable"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="page-config" class="page" hidden>
          <div id="config-none" class="config-none">
            No configuration. Choose File ▸ New Configuration or Open Configuration…, or attach a tag.
          </div>
          <div id="config-doc" class="config-doc" hidden>
            <div class="config-head">
              <span id="config-name" class="kit-selectable"></span>
              <span id="config-modified" class="kit-text-warn"></span>
            </div>
            <pre id="config-text" class="config-text kit-selectable"></pre>
          </div>
        </section>

        <section id="page-log" class="page" hidden>
          <div class="kit-log log-page">
            <textarea id="log-text" readonly title="log of error messages" spellcheck="false"></textarea>
            <div class="kit-log-bar">
              <button id="save-log" class="kit-button" type="button" title="Save error log to file">Save Error Log</button>
              <button id="clear-log" class="kit-button" type="button" title="Clear the error log">Clear</button>
              <span class="kit-spacer"></span>
              <label for="log-level">Log Level</label>
              <select id="log-level" class="kit-select" title="Set error logging level">
                <option>TRACE</option><option>DEBUG</option><option selected>INFO</option><option>WARN</option><option>ERROR</option>
              </select>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="../../../ui-kit/kit.js"></script>
  <script src="mock-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
