# The Tauri shell: runs the engine, forwards the page's commands and queries
# to it, and emits its events to the page. All behaviour is in ../core.
[package]
name = "tagmonitor"
version = "0.1.0"
edition = "2024"
description = "Tag Monitor: attach to a tag, check, configure and start it, and download its data"
publish = false

[dependencies]
tagmonitor-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
log = "0.4"

# Already in the graph through Tauri; named here to opt out of App Nap.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSProcessInfo", "NSString"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[features]
# Download Data... through the C++ SQLite writer; needs libtagcore_c and
# TAGCORE_C_LIB_DIR (see ../core/Cargo.toml).
sqlitelog = ["tagmonitor-core/sqlitelog"]

# Every item is documented, private ones included (AGENTS.md,
# "Checking documentation coverage"); keep it that way.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
