site_name: Ultralight Tags User Guide
site_description: User guides for the Ultralight Tags host applications.
site_author: Indiana University

docs_dir: src
site_dir: site
use_directory_urls: false

theme:
  name: material
  icon:
    logo: material/bird
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid blocks as diagrams. Without this the theme
        # syntax-highlights them as source and the diagram is lost.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Project Page: https://geoffreymbrown.github.io/ultralight-tags/
  - IMUTag Overview: imutag-overview.md
  - Applications:
      - Tag Monitor: apps/qtmonitor.md
      - SensorViz: apps/sensorviz.md
      - Qt Calibrate: apps/qtcalibrate.md
      - Qt Program: apps/qtprogram.md
      - Bit Tag Visualizer: apps/btdataviz.md
  - Command Line:
      - Overview: cli/index.md
      - tag-test: cli/tag-test.md
      - tag-dwnld: cli/tag-dwnld.md
      - tag-info: cli/tag-info.md
      - tag-reset: cli/tag-reset.md
      - tag-start: cli/tag-start.md
      - tag-stop: cli/tag-stop.md
      - tag-cal: cli/tag-cal.md
      - dataprocessing: cli/dataprocessing.md
  - Workflows:
      - First Setup: workflows/first-setup.md
      - Firmware Programming: workflows/firmware-programming.md
      - Calibration: workflows/calibration.md
      - Data Download: workflows/data-download.md
  - Reference:
      - SQLite Log Format: reference/sqlite-logs.md
      - Documentation Guidelines: reference/documentation-guidelines.md
      - Troubleshooting: reference/troubleshooting.md
