[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagsim"
version = "0.1.0"
description = "Synthetic IMUTag logs from recorded flights, with ground truth (testing infrastructure)"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  # Protocol messages, compiled from proto/ at import time.
  "tagclient",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tagsim = "tagsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
