[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagclient"
version = "0.1.0"
description = "Python client for tag-server, the gRPC test server for tags"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "grpcio>=1.60",
  # protos_and_services() compiles the .proto files at import time.
  "grpcio-tools>=1.60",
  "protobuf>=5.26",
  # google.rpc.Status, for error details.
  "googleapis-common-protos>=1.60",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
