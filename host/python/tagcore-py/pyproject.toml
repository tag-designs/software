[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tagcore"
version = "0.1.0"
description = "SWD capture and recovery of tags: sessions that attach without booting the firmware, external flash through the loaders, captures and the rescue erase"
requires-python = ">=3.9"

[tool.maturin]
python-source = "python"
module-name = "tagcore._native"
features = ["pyo3/extension-module"]
