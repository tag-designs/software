# Safe Rust interface to the live magnetometer and accelerometer calibration
# (sensoranalysis's CalibrationSession) and the compass display conversions,
# through the tagcore_c library (host/libraries/tagcore-c), so a Rust program
# calibrates exactly as qtcalibrate does.
#
# Needs libtagcore_c built by CMake (-DBUILD_TAGCORE_C=ON); tagcore-c-sys
# links it, found through TAGCORE_C_LIB_DIR. See README.md.
[package]
name = "calibsession"
version = "0.1.0"
edition = "2024"
description = "The tag calibration session and compass angles, through the C++ core (tagcore_c)"
publish = false

[dependencies]
tagcore-c-sys = { version = "0.1.0", path = "../tagcore-c-sys" }

[dev-dependencies]
serde_json = "1.0.154"

# Every item is documented, private ones included (AGENTS.md,
# "Checking documentation coverage"); keep it that way.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
