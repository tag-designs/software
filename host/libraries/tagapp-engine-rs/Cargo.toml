# The engine toolkit every application's core shares: the Engine handle, the
# engine loop, the prompt queue, the `ready` guard and the UI logger. No Tauri
# dependency, so a core crate builds and tests without a window. See
# host/design/proposals/unified-app-shell.md.
[package]
name = "tagapp-engine"
version = "0.1.0"
edition = "2024"
description = "The engine toolkit shared by the Tauri applications' core crates"
publish = false

[dependencies]
log = "0.4"
serde_json = "1"

# Every item is documented, private ones included (AGENTS.md,
# "Checking documentation coverage"); keep it that way.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
