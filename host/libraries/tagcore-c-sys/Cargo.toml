# Links the tagcore_c library (host/libraries/tagcore-c), the C interface to
# the C++ host libraries. The one crate in a build that declares
# `links = "tagcore_c"`: the safe wrappers over it -- taglogwriter,
# calibsession and sensorviz-session -- depend on this and declare their own
# functions, so a program may use any of them together.
#
# Needs libtagcore_c built by CMake (-DBUILD_TAGCORE_C=ON); build.rs finds it
# through TAGCORE_C_LIB_DIR. See README.md.
[package]
name = "tagcore-c-sys"
version = "0.1.0"
edition = "2024"
description = "Links the tagcore_c C interface to the C++ host libraries"
publish = false
# Lets a dependent's build script read DEP_TAGCORE_C_LIB_DIR, to set an rpath.
# Only one crate in a build may declare this.
links = "tagcore_c"

# Every item is documented, private ones included (AGENTS.md,
# "Checking documentation coverage"); keep it that way.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
