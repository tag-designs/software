<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" aria-labelledby="t d">
<title id="t">IMUTag run current vs sample rate, BMP581 CONTINUOUS and NORMAL modes</title>
<desc id="d">NORMAL mode draws 101 uA less than CONTINUOUS at 100 Hz (545 against 444 uA); the saving shrinks as the pressure ODR rises and is gone at 1600 Hz, where the ODR is 200 Hz.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; }
  }
  .bg { fill:var(--surface); }
  .title { fill:var(--ink); font-size:15px; font-weight:600; }
  .sub { fill:var(--ink2); font-size:12px; }
  .tick { fill:var(--muted); font-size:11.5px; }
  .lab { fill:var(--ink); font-size:12.5px; font-weight:600; }
  .val { fill:var(--ink2); font-size:11.5px; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .axis { stroke:var(--axis); stroke-width:1; }
  .gap { stroke:var(--muted); stroke-width:1; stroke-dasharray:2 3; }
  .s1 { stroke:var(--s1); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .s2 { stroke:var(--s2); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .m1 { fill:var(--s1); stroke:var(--surface); stroke-width:2; }
  .m2 { fill:var(--s2); stroke:var(--surface); stroke-width:2; }
</style>
<rect class="bg" width="680" height="440"/>
<text class="title" x="24" y="26">NORMAL mode saves about 100 uA at low rates, nothing at 1600 Hz</text>
<text class="sub" x="24" y="46">Run current, IMUTagNandBmp581, BMP581 power mode only; measured at 3.69 V on 2026-11-03</text>
<line class="axis" x1="72" y1="340.0" x2="560" y2="340.0"/>
<text class="tick" x="64" y="344.0" text-anchor="end">0</text>
<line class="grid" x1="72" y1="295.0" x2="560" y2="295.0"/>
<text class="tick" x="64" y="299.0" text-anchor="end">200</text>
<line class="grid" x1="72" y1="250.0" x2="560" y2="250.0"/>
<text class="tick" x="64" y="254.0" text-anchor="end">400</text>
<line class="grid" x1="72" y1="205.0" x2="560" y2="205.0"/>
<text class="tick" x="64" y="209.0" text-anchor="end">600</text>
<line class="grid" x1="72" y1="160.0" x2="560" y2="160.0"/>
<text class="tick" x="64" y="164.0" text-anchor="end">800</text>
<line class="grid" x1="72" y1="115.0" x2="560" y2="115.0"/>
<text class="tick" x="64" y="119.0" text-anchor="end">1000</text>
<line class="grid" x1="72" y1="70.0" x2="560" y2="70.0"/>
<text class="tick" x="64" y="74.0" text-anchor="end">1200</text>
<text class="tick" x="20" y="205.0" transform="rotate(-90 20 205.0)" text-anchor="middle">run current (uA)</text>
<text class="tick" x="72.0" y="358" text-anchor="middle">100</text>
<text class="tick" x="72.0" y="373" text-anchor="middle">(25)</text>
<text class="tick" x="194.0" y="358" text-anchor="middle">200</text>
<text class="tick" x="194.0" y="373" text-anchor="middle">(25)</text>
<text class="tick" x="316.0" y="358" text-anchor="middle">400</text>
<text class="tick" x="316.0" y="373" text-anchor="middle">(50)</text>
<text class="tick" x="438.0" y="358" text-anchor="middle">800</text>
<text class="tick" x="438.0" y="373" text-anchor="middle">(100)</text>
<text class="tick" x="560.0" y="358" text-anchor="middle">1600</text>
<text class="tick" x="560.0" y="373" text-anchor="middle">(200)</text>
<text class="tick" x="316.0" y="394" text-anchor="middle">IMU sample rate, Hz (BMP581 ODR, Hz)</text>
<line class="gap" x1="72.0" y1="217.4" x2="72.0" y2="240.2"/>
<text class="val" x="79.0" y="232.8" text-anchor="start">-101 uA</text>
<line class="gap" x1="194.0" y1="207.8" x2="194.0" y2="230.8"/>
<text class="val" x="200.0" y="252.8" text-anchor="middle">-102 uA</text>
<line class="gap" x1="316.0" y1="188.7" x2="316.0" y2="209.0"/>
<text class="val" x="322.0" y="231.0" text-anchor="middle">-90 uA</text>
<line class="gap" x1="438.0" y1="150.8" x2="438.0" y2="165.8"/>
<text class="val" x="444.0" y="187.8" text-anchor="middle">-67 uA</text>
<path class="s1" d="M72.0 217.4 L194.0 207.8 L316.0 188.7 L438.0 150.8 L560.0 109.7"/>
<path class="s2" d="M72.0 240.2 L194.0 230.8 L316.0 209.0 L438.0 165.8 L560.0 108.8"/>
<circle class="m1" cx="72.0" cy="217.4" r="4.5"/>
<circle class="m1" cx="194.0" cy="207.8" r="4.5"/>
<circle class="m1" cx="316.0" cy="188.7" r="4.5"/>
<circle class="m1" cx="438.0" cy="150.8" r="4.5"/>
<circle class="m1" cx="560.0" cy="109.7" r="4.5"/>
<circle class="m2" cx="72.0" cy="240.2" r="4.5"/>
<circle class="m2" cx="194.0" cy="230.8" r="4.5"/>
<circle class="m2" cx="316.0" cy="209.0" r="4.5"/>
<circle class="m2" cx="438.0" cy="165.8" r="4.5"/>
<circle class="m2" cx="560.0" cy="108.8" r="4.5"/>
<text class="lab" x="80.0" y="199.4">CONTINUOUS</text>
<text class="lab" x="80.0" y="260.2">NORMAL</text>
<text class="val" x="570.0" y="105.7">1024 / 1028</text>
<line class="s1" x1="72" y1="424" x2="94" y2="424"/><circle class="m1" cx="83" cy="424" r="4"/><text class="val" x="102" y="428">CONTINUOUS: converts at its maximum rate</text>
<line class="s2" x1="362" y1="424" x2="384" y2="424"/><circle class="m2" cx="373" cy="424" r="4"/><text class="val" x="392" y="428">NORMAL: converts at the ODR</text>
</svg>
