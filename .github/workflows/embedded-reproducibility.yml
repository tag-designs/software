name: Embedded reproducibility

# Checks that the committed generated protocol sources still match the inputs
# recorded beside them. Those sources exist so an ordinary firmware build needs
# no code generator; that only helps while they are actually current, and a
# stale one is invisible locally to anyone whose build does not regenerate.
#
# Deliberately needs nothing but CMake and a checkout: no ARM toolchain, no
# fmpp, no nanopb generator. A check that needed the generator in order to prove
# the generator is unnecessary would be self-defeating, and one that configured
# the whole embedded tree would fail for reasons unrelated to freshness.
#
# ChibiOS is checked out because the committed board files are rendered from its
# templates, which makes them inputs. REQUIRE_CHIBIOS=ON turns a missing
# submodule into a failure here, because in CI a skipped check looks exactly
# like a passing one.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-sources:
    name: Generated sources are current
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # ChibiOS is needed because the committed board files are generated
          # from its templates, so those templates are inputs and must be
          # hashed. Shallow, and only this one submodule.
          submodules: true
          fetch-depth: 1

      - name: Check committed generated sources
        run: |
          cmake -DSOURCE_DIR="$GITHUB_WORKSPACE" \
                -DREQUIRE_CHIBIOS=ON \
                -P cmake/CheckGeneratedSourcesFresh.cmake
