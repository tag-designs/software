name: Release host tools

# Builds the Windows, macOS and Linux host tool packages: from v4.0 the Rust
# applications and command-line tools, built by cargo, and the C++ programs
# with no Rust equivalent; no Qt (host/design/proposals/rust-default-release.md).
# Pushing a version tag (for example `v4.0`) builds all three and opens a
# *draft* GitHub release with the Windows .zip and the Linux .tar.gz attached.
# `workflow_dispatch` runs the same builds without publishing, so the pipeline
# can be exercised without cutting a tag; with its `legacy` input it builds
# the legacy configuration instead (BUILD_LEGACY_HOST: Qt installed, the Qt
# applications added), so that build is exercised before it rots. A legacy
# run never publishes, and its artifacts are named *-legacy.
#
# The Linux tarball is tested before it is uploaded: host/tools/
# linux-package-test.sh unpacks it into clean Ubuntu 24.04 and Debian 13
# containers and runs every application against the repository's fixtures,
# under Wayland and X11. A package that fails is never uploaded.
#
# The Windows ZIP is Authenticode-signed with Azure Artifact Signing: in CI by
# the sign-windows job when WINDOWS_SIGNING_IN_CI is set, otherwise locally by
# host/tools/sign-ci-windows.sh, which replaces the unsigned ZIP on the draft.
# See docs/release/windows-code-signing.md.
#
# The macOS DMG is deliberately not attached. CI has no access to the Developer
# ID key -- keeping it out of a public repository's secrets is the point -- so
# the DMG it builds is only ad-hoc signed and macOS refuses to launch it. The
# job leaves that DMG as a workflow artifact with a build provenance
# attestation, and `cmake --build <build-dir> --target sign-latest`
# (host/tools/sign-ci-macos.sh) on a Mac holding the key checks the
# attestation, re-signs the DMG with the Developer ID identity and uploads it
# to this draft. `host/tools/release-macos.sh`, which builds and signs entirely
# locally, remains the fallback.
#
# The release is left as a draft for that reason: it is incomplete until the
# macOS package is uploaded.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      legacy:
        description: "Build the legacy configuration (Qt applications, BUILD_LEGACY_HOST=ON)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Qt provisioned by aqt for a legacy build only; the release build has no
  # Qt. Keep this equal to the Qt the local presets name in
  # CMakePresets.json and to HOST_QT_VERSION.
  QT_VERSION: "6.10.3"
  # Must match the baseline in vcpkg-configuration.json so manifest-mode
  # version resolution finds the commit in this shallow clone.
  VCPKG_BASELINE: "99a97de2cb371449d4fb9dc970f2ac562d689ec2"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Build provenance attestation of the macOS DMG and the Linux tarball.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: host-tools-windows-x64
            triplet: x64-windows-static-md
            host_triplet: x64-windows
            qt_host: windows
            qt_arch: win64_msvc2022_64
            generator: Visual Studio 17 2022
            generator_args: -A x64
            configure_extra: ""
            package_glob: build/*.zip
          - name: macOS arm64
            os: macos-15
            artifact: host-tools-macos-arm64
            triplet: arm64-osx-static
            host_triplet: arm64-osx
            qt_host: mac
            qt_arch: clang_64
            generator: Ninja
            generator_args: ""
            configure_extra: "-DCMAKE_BUILD_TYPE=Release -DMACOS_SIGN_APPS=ON -DMACOS_CODE_SIGN_IDENTITY=-"
            package_glob: build/*.dmg
          # Built on the oldest distribution the package supports: the
          # runner's glibc (2.39) is the floor for every binary in it. See
          # host/design/proposals/linux-release-package.md.
          - name: Linux x86_64
            os: ubuntu-24.04
            artifact: host-tools-linux-x64
            triplet: x64-linux
            host_triplet: x64-linux
            qt_host: linux
            qt_arch: linux_gcc_64
            generator: Ninja
            generator_args: ""
            configure_extra: "-DCMAKE_BUILD_TYPE=Release"
            package_glob: build/*.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so the CMake version logic can resolve the release
          # tag via `git tag --merged HEAD`.
          fetch-depth: 0

      - name: Check out vcpkg at the manifest baseline
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_BASELINE }}
          path: vcpkg
          fetch-depth: 1

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Install macOS build tools (autotools for vcpkg ports, ninja)
        if: runner.os == 'macOS'
        run: brew install autoconf autoconf-archive automake libtool ninja

      # Autotools and libudev for vcpkg's libusb port; WebKitGTK for the Tauri
      # applications; for a legacy build, OpenGL, EGL and xkbcommon headers
      # for Qt's GUI modules.
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          qt_headers=
          if [ "${{ inputs.legacy }}" = true ]; then
            qt_headers="libgl1-mesa-dev libegl-dev libxkbcommon-dev"
          fi
          sudo apt-get install -y --no-install-recommends ninja-build \
            autoconf autoconf-archive automake libtool libudev-dev \
            libwebkit2gtk-4.1-dev $qt_headers

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: >-
            vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-${{
            hashFiles('vcpkg.json', 'vcpkg-configuration.json',
            'cmake/vcpkg-triplets/*') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-

      # Tag Programmer, Tag Monitor, Tag Calibrator, Tag View and the flash
      # tools are built by cargo from the one host Rust workspace
      # (host/Cargo.toml). The runners carry rustup; this pins the toolchain
      # to current stable (the crates need Rust 1.85 or newer, for edition
      # 2024) and caches the dependency builds under the CMake build tree's
      # shared cargo directory (cmake/HostRust.cmake).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            host -> ../build/host/cargo

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: host/docs/requirements.txt

      - name: Install documentation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r host/docs/requirements.txt

      - name: Install Qt ${{ env.QT_VERSION }} (legacy build only)
        if: inputs.legacy
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          # Add-ons the apps' QML needs at run time: sensorui's orientation
          # view imports QtQuick3D. aqt installs no
          # add-on's dependencies, so Quick 3D's QtShaderTools and
          # QtQuickTimeline are listed too. Nothing links these, so a missing
          # one used to build and package cleanly and fail at launch; the
          # qml_import_check_<app> build targets now fail the build instead.
          modules: qtquick3d qtshadertools qtquicktimeline
          cache: true

      - name: Resolve CMake-friendly paths
        shell: bash
        run: |
          # Bash on the Windows runner reports MSYS paths ("/d/a/...") and Qt
          # is reported with backslashes; CMake needs native forward-slash
          # paths in both cases.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "SRC_DIR=$(cygpath -m "$PWD")" >> "$GITHUB_ENV"
          else
            echo "SRC_DIR=$PWD" >> "$GITHUB_ENV"
          fi
          # Empty unless Qt was installed (a legacy build).
          echo "QT_CMAKE_PREFIX=$(printf '%s' "${QT_ROOT_DIR:-}" | tr '\\' '/')" >> "$GITHUB_ENV"
          if [ "${{ inputs.legacy }}" = true ]; then
            echo "LEGACY_HOST=ON" >> "$GITHUB_ENV"
            echo "ARTIFACT_SUFFIX=-legacy" >> "$GITHUB_ENV"
          else
            echo "LEGACY_HOST=OFF" >> "$GITHUB_ENV"
            echo "ARTIFACT_SUFFIX=" >> "$GITHUB_ENV"
          fi

      # REPRODUCIBLE_BUILD makes reproducibility problems configure errors
      # rather than warnings; in a legacy build that includes a Qt other than
      # HOST_QT_VERSION (which must equal QT_VERSION above).
      - name: Configure
        shell: bash
        run: |
          export VCPKG_DEFAULT_BINARY_CACHE="$SRC_DIR/vcpkg-cache"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cmake -S . -B build \
            -G "${{ matrix.generator }}" ${{ matrix.generator_args }} \
            -DCMAKE_TOOLCHAIN_FILE="$SRC_DIR/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_HOST_TRIPLET=${{ matrix.host_triplet }} \
            -DVCPKG_OVERLAY_TRIPLETS="$SRC_DIR/cmake/vcpkg-triplets" \
            -DCMAKE_PREFIX_PATH="$QT_CMAKE_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$SRC_DIR/build/install" \
            -DBUILD_HOST=ON \
            -DBUILD_LEGACY_HOST=$LEGACY_HOST \
            -DBUILD_RUST_APPS=ON \
            -DBUILD_EMBEDDED=OFF \
            -DBUILD_HOST_DOCS=ON \
            -DBUILD_DEVELOPER_DOCS=OFF \
            -DHOST_MKDOCS_COMMAND="python;-m;mkdocs" \
            -DREPRODUCIBLE_BUILD=ON \
            ${{ matrix.configure_extra }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # Each Tauri app embeds its page at compile time; when Tauri cannot
      # find it the build still succeeds and the window opens on "index.html
      # not found" (on Windows, until the build scripts canonicalized the
      # page's path). Each executable must carry its page's app.js.
      - name: Check the Rust apps embed their pages
        shell: bash
        run: |
          status=0
          for app in tagprogram tagmonitor tagcalibrate tagview; do
            exe=build/host/cargo/release/$app
            [ -f "$exe" ] || exe="$exe.exe"
            if grep -aqF "/app.js" "$exe"; then
              echo "ok      $exe"
            else
              echo "::error::$exe has no embedded page"; status=1
            fi
          done
          exit $status

      - name: Package
        shell: bash
        run: cmake --build build --config Release --target package

      - name: Test the Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package=$(ls build/*.tar.gz)
          for image in ubuntu:24.04 debian:13; do
            host/tools/linux-build-check.sh --package "$package" \
              --image "$image" --out "package-test/${image/:/-}"
          done

      - name: Keep the Linux package test's screenshots and logs
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-test${{ env.ARTIFACT_SUFFIX }}
          path: package-test
          if-no-files-found: ignore
          retention-days: 14

      # Records that this workflow built the package from this commit. The
      # local signing steps (host/tools/sign-ci-macos.sh for the DMG,
      # host/tools/sign-ci-windows.sh for the ZIP) refuse a package without
      # it, so what gets signed is provably this build. The Linux tarball is
      # not signed; this is what ties it to the workflow run.
      - name: Attest package provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.package_glob }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}${{ env.ARTIFACT_SUFFIX }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error
          retention-days: 14

  # Authenticode-signs the Windows package with Azure Artifact Signing, so
  # SmartScreen and Smart App Control see a verified publisher. It unpacks the
  # ZIP CPack built, signs every .exe and .dll in it that is not already
  # signed (the Microsoft runtime DLLs keep Microsoft's signature), checks
  # that every one now carries a valid, timestamped signature, repacks it
  # with the same name and layout, attests it, and replaces the build job's
  # artifact, so the release job attaches the signed ZIP.
  #
  # Authentication is OpenID Connect: the job's GitHub token is exchanged for
  # an Entra ID token through a federated credential on the app registration
  # that holds the Artifact Signing Certificate Profile Signer role, so no
  # secret is stored. The federated credential names the `windows-signing`
  # environment, whose deployment rules decide which refs may sign. The
  # identifiers are repository variables, not secrets: AZURE_TENANT_ID,
  # AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID, ARTIFACT_SIGNING_ENDPOINT,
  # ARTIFACT_SIGNING_ACCOUNT and ARTIFACT_SIGNING_PROFILE; the local signing
  # script, host/tools/sign-ci-windows.sh, reads the same ones. The job runs
  # only when WINDOWS_SIGNING_IN_CI is `true`. Until then it is skipped, the
  # release job attaches the unsigned ZIP, and sign-ci-windows.sh replaces it
  # with one signed locally. A legacy build is never signed (it never
  # publishes).
  # Setup and checks: docs/release/windows-code-signing.md.
  sign-windows:
    name: Sign the Windows package
    needs: build
    if: ${{ !inputs.legacy && vars.WINDOWS_SIGNING_IN_CI == 'true' }}
    runs-on: windows-2022
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download the unsigned package
        uses: actions/download-artifact@v4
        with:
          name: host-tools-windows-x64
          path: unsigned

      - name: Unpack and list the files to sign
        id: unpack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem unsigned -Filter *.zip)
          if ($zips.Count -ne 1) { throw "expected one ZIP in unsigned/, found $($zips.Count)" }
          Expand-Archive -Path $zips[0].FullName -DestinationPath stage
          "PACKAGE_NAME=$($zips[0].Name)" >> $env:GITHUB_ENV
          # Ours: everything not already signed. Anything signed but invalid
          # is a fault in the build, not something to paper over by signing.
          $toSign = @()
          foreach ($f in Get-ChildItem stage -Recurse -Include *.exe,*.dll) {
            $status = (Get-AuthenticodeSignature -LiteralPath $f.FullName).Status
            if ($status -eq 'NotSigned') { $toSign += $f.FullName }
            elseif ($status -eq 'Valid') { "already signed: $($f.FullName)" }
            else { throw "$($f.FullName): existing signature is $status" }
          }
          if ($toSign.Count -eq 0) { throw "no unsigned .exe or .dll in the package" }
          $toSign | ForEach-Object { "to sign: $_" }
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          "files<<$delimiter" >> $env:GITHUB_OUTPUT
          $toSign >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Log in to Azure (OpenID Connect)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.unpack.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Ultralight Tags host tools
          description-url: ${{ github.server_url }}/${{ github.repository }}
          # Only the Azure CLI credential from the login step above.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # Every PE file in the package, ours and Microsoft's, must now verify
      # to a trusted root and carry a timestamp, so the signature outlives
      # the certificate's 72-hour validity.
      - name: Verify every signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          foreach ($f in Get-ChildItem stage -Recurse -Include *.exe,*.dll) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            $rel = [IO.Path]::GetRelativePath("$PWD/stage", $f.FullName)
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
              "::error::$rel signature $($sig.Status), timestamp $([bool]$sig.TimeStamperCertificate)"
              $bad++
            } else {
              "ok  $rel  $($sig.SignerCertificate.Subject)"
            }
          }
          if ($bad) { exit 1 }

      # Same name and top-level layout as the ZIP CPack wrote.
      - name: Repack the signed package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force signed | Out-Null
          $out = Join-Path $PWD "signed/$env:PACKAGE_NAME"
          Push-Location stage
          $entries = @(Get-ChildItem -Name)
          cmake -E tar cf $out --format=zip -- @entries
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          Get-Item $out | Format-List Name, Length

      - name: Attest package provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: signed/*.zip

      - name: Replace the package artifact with the signed one
        uses: actions/upload-artifact@v4
        with:
          name: host-tools-windows-x64
          path: signed/*.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    name: Open the draft release
    # Only a tag push publishes; a tag push has no inputs, so it is never a
    # legacy build. The Windows package must be signed when signing is
    # configured; when it is not, sign-windows is skipped and the build's
    # unsigned ZIP is attached.
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
      && needs.build.result == 'success'
      && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: host-tools-*
          merge-multiple: true

      - name: List packages
        run: ls -lR artifacts

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The Windows (signed by sign-windows) and Linux packages. The macOS DMG built above is
          # ad-hoc signed and is not shippable; `sign-latest` re-signs it
          # locally and uploads it.
          shopt -s nullglob
          windows=(artifacts/*.zip)
          linux=(artifacts/*.tar.gz)
          if [ ${#windows[@]} -eq 0 ]; then
            echo "no Windows package found in artifacts/" >&2
            exit 1
          fi
          if [ ${#linux[@]} -eq 0 ]; then
            echo "no Linux package found in artifacts/" >&2
            exit 1
          fi
          packages=("${windows[@]}" "${linux[@]}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${packages[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --draft \
              --generate-notes \
              "${packages[@]}"
          fi
          echo "Draft release $TAG is ready. Sign and upload the macOS package"
          echo "with 'cmake --build <build-dir> --target sign-latest', then publish."
