name: Release host tools

# Builds the Windows and macOS host tool packages. Pushing a version tag
# (for example `v3.1`) builds both platforms and opens a *draft* GitHub release
# with the Windows .zip attached. `workflow_dispatch` runs the same builds
# without publishing, so the pipeline can be exercised without cutting a tag.
#
# The macOS DMG is deliberately not attached. CI has no access to the Developer
# ID key -- keeping it out of a public repository's secrets is the point -- so
# the DMG it builds is only ad-hoc signed and macOS refuses to launch it. The
# job leaves that DMG as a workflow artifact with a build provenance
# attestation, and `cmake --build <build-dir> --target sign-latest`
# (host/tools/sign-ci-macos.sh) on a Mac holding the key checks the
# attestation, re-signs the DMG with the Developer ID identity and uploads it
# to this draft. `host/tools/release-macos.sh`, which builds and signs entirely
# locally, remains the fallback.
#
# The release is left as a draft for that reason: it is incomplete until the
# macOS package is uploaded.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Qt provisioned by aqt for the CI builds. Keep this equal to the Qt the
  # local presets name in CMakePresets.json, so a released binary links the
  # same Qt a developer builds against. Changing it means regenerating
  # LICENSES/host/Qt-THIRD-PARTY-NOTICES.txt and updating the written source
  # offer in LICENSES/host/README.md.
  QT_VERSION: "6.10.3"
  # Must match the baseline in vcpkg-configuration.json so manifest-mode
  # version resolution finds the commit in this shallow clone.
  VCPKG_BASELINE: "99a97de2cb371449d4fb9dc970f2ac562d689ec2"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Build provenance attestation of the macOS DMG.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: host-tools-windows-x64
            triplet: x64-windows-static-md
            host_triplet: x64-windows
            qt_host: windows
            qt_arch: win64_msvc2022_64
            generator: Visual Studio 17 2022
            generator_args: -A x64
            configure_extra: ""
            package_glob: build/*.zip
          - name: macOS arm64
            os: macos-15
            artifact: host-tools-macos-arm64
            triplet: arm64-osx-static
            host_triplet: arm64-osx
            qt_host: mac
            qt_arch: clang_64
            generator: Ninja
            generator_args: ""
            configure_extra: "-DCMAKE_BUILD_TYPE=Release -DMACOS_SIGN_APPS=ON -DMACOS_CODE_SIGN_IDENTITY=-"
            package_glob: build/*.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so the CMake version logic can resolve the release
          # tag via `git tag --merged HEAD`.
          fetch-depth: 0

      - name: Check out vcpkg at the manifest baseline
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_BASELINE }}
          path: vcpkg
          fetch-depth: 1

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Install macOS build tools (autotools for vcpkg ports, ninja)
        if: runner.os == 'macOS'
        run: brew install autoconf autoconf-archive automake libtool ninja

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: >-
            vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-${{
            hashFiles('vcpkg.json', 'vcpkg-configuration.json',
            'cmake/vcpkg-triplets/*') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: host/docs/requirements.txt

      - name: Install documentation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r host/docs/requirements.txt

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          # Add-ons the apps' QML needs at run time: sensorui's orientation
          # view imports QtQuick3D and QtQuick.Scene3D. aqt installs no
          # add-on's dependencies, so Quick 3D's QtShaderTools and
          # QtQuickTimeline are listed too. Nothing links these, so a missing
          # one used to build and package cleanly and fail at launch; the
          # qml_import_check_<app> build targets now fail the build instead.
          modules: qt3d qtquick3d qtshadertools qtquicktimeline
          cache: true

      - name: Resolve CMake-friendly paths
        shell: bash
        run: |
          # Bash on the Windows runner reports MSYS paths ("/d/a/...") and Qt
          # is reported with backslashes; CMake needs native forward-slash
          # paths in both cases.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "SRC_DIR=$(cygpath -m "$PWD")" >> "$GITHUB_ENV"
          else
            echo "SRC_DIR=$PWD" >> "$GITHUB_ENV"
          fi
          echo "QT_CMAKE_PREFIX=$(printf '%s' "$QT_ROOT_DIR" | tr '\\' '/')" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          export VCPKG_DEFAULT_BINARY_CACHE="$SRC_DIR/vcpkg-cache"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cmake -S . -B build \
            -G "${{ matrix.generator }}" ${{ matrix.generator_args }} \
            -DCMAKE_TOOLCHAIN_FILE="$SRC_DIR/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_HOST_TRIPLET=${{ matrix.host_triplet }} \
            -DVCPKG_OVERLAY_TRIPLETS="$SRC_DIR/cmake/vcpkg-triplets" \
            -DCMAKE_PREFIX_PATH="$QT_CMAKE_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$SRC_DIR/build/install" \
            -DBUILD_HOST=ON \
            -DBUILD_QT_APPS=ON \
            -DBUILD_EMBEDDED=OFF \
            -DBUILD_HOST_DOCS=ON \
            -DBUILD_DEVELOPER_DOCS=OFF \
            -DHOST_MKDOCS_COMMAND="python;-m;mkdocs" \
            ${{ matrix.configure_extra }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: cmake --build build --config Release --target package

      # Records that this workflow built the DMG from this commit. The local
      # signing step (host/tools/sign-ci-macos.sh) refuses a DMG without it,
      # so what gets the Developer ID signature is provably this build.
      - name: Attest macOS package provenance
        if: runner.os == 'macOS'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.package_glob }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Open the draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List packages
        run: ls -lR artifacts

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only the Windows package. The macOS DMG built above is ad-hoc
          # signed and is not shippable; `sign-latest` re-signs it locally
          # and uploads it.
          shopt -s nullglob
          windows=(artifacts/*.zip)
          if [ ${#windows[@]} -eq 0 ]; then
            echo "no Windows package found in artifacts/" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${windows[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --draft \
              --generate-notes \
              "${windows[@]}"
          fi
          echo "Draft release $TAG is ready. Sign and upload the macOS package"
          echo "with 'cmake --build <build-dir> --target sign-latest', then publish."
