site_name: Ultralight Tags Developer Docs
site_description: Developer architecture, design, and API documentation for the tag-designs software tree.
site_author: Indiana University

docs_dir: src
site_dir: site
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid blocks as diagrams. Without this the theme
        # syntax-highlights them as source and the diagram is lost.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

# Everything under "Source Tree" is generated from each document's front matter
# by docs/tools/docs.py at build time; the marker line is replaced in the staged
# copy. Do not list documents here. See docs/documentation-guide.md.
nav:
  - Home: index.md
  - Project Page: https://geoffreymbrown.github.io/ultralight-tags/
  - Source Tree:
      # @GENERATED_NAV@
  - API Reference:
      - Overview: api.md
      - Doxygen Output: api/index.md
  - Documentation Guide: reference/docs/documentation-guide.md
